spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 1s
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
    connection-timeout: 1s
    socket-timeout: 2s
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

server:
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/problem+json,text/html,text/css,application/javascript,text/javascript

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  auth:
    jwt-secret: ${JWT_SECRET}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}
    secure-cookie: ${SECURE_COOKIE:true}
  tracking:
    redis-enabled: ${TRACKING_REDIS_ENABLED:false}
  search:
    elasticsearch-enabled: ${ELASTICSEARCH_ENABLED:false}
  fault-tolerance:
    timeout-ms: ${DEPENDENCY_TIMEOUT_MS:800}
    failure-threshold: ${CIRCUIT_FAILURE_THRESHOLD:5}
    open-seconds: ${CIRCUIT_OPEN_SECONDS:30}
    max-concurrent: ${DEPENDENCY_MAX_CONCURRENT:20}
