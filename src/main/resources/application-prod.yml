spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  forward-headers-strategy: framework

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  auth:
    jwt-secret: ${JWT_SECRET}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}
    secure-cookie: ${SECURE_COOKIE:true}
  tracking:
    redis-enabled: ${TRACKING_REDIS_ENABLED:false}
