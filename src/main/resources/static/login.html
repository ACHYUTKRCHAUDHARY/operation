<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YardFlow Login</title><link rel="stylesheet" href="/css/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f5f6f8}.login-card{width:min(430px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:34px;box-shadow:0 18px 55px rgba(15,23,42,.08)}.login-card h1{margin:10px 0 6px}.login-card p{color:#64748b;margin-bottom:24px}.login-card label{display:grid;gap:7px;margin:15px 0;font-weight:600}.login-card input{padding:12px 14px;border:1px solid #d7dce3;border-radius:10px;font:inherit}.login-card button{width:100%;margin-top:10px}.login-error{min-height:20px;color:#b42318;font-size:14px;margin-top:12px}</style></head><body><main class="login-card"><div class="brand"><div class="brand-mark">YF</div><div><strong>YardFlow</strong><span>Operations</span></div></div><h1>Sign in</h1><p>Access container, porta cabin, workshop and delivery operations.</p><form id="login-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required></label><button class="primary-btn" type="submit">Sign in</button><div id="login-error" class="login-error"></div></form></main><script src="/js/login.js"></script></body></html>
