<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Delivery Tracking</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/css/styles.css"></head><body><div class="tracking-layout"><section class="tracking-panel"><span class="section-label">LIVE DELIVERY TRACKING</span><h1 class="tracking-title" id="delivery-title">Loading delivery…</h1><p class="tracking-note">This page updates the latest driver position and destination. Use the simulator below during development to send GPS points.</p><div class="tracking-kv"><div><span>Status</span><strong id="status">—</strong></div><div><span>Vehicle</span><strong id="vehicle">—</strong></div><div><span>Driver</span><strong id="driver">—</strong></div><div><span>Distance left</span><strong id="distance">—</strong></div></div><a class="ghost-btn" href="/">← Dashboard</a><form id="gps-form" class="tracking-form"><span class="section-label">DEVELOPMENT GPS SIMULATOR</span><input name="latitude" type="number" step="any" placeholder="Latitude" required><input name="longitude" type="number" step="any" placeholder="Longitude" required><input name="speedKph" type="number" step="any" placeholder="Speed km/h"><button class="primary-btn">Send location</button></form></section><div id="map" class="tracking-map"></div></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/js/tracking.js"></script></body></html>
