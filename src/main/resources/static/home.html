<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173f2c">
  <title>YardFlow Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body{background:#f3f6f4;min-height:100vh}.workspace{max-width:1280px;margin:auto;padding:32px}.workspace-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.workspace-brand{display:flex;align-items:center;gap:12px}.workspace-brand .brand-mark{width:44px;height:44px}.account-box{text-align:right}.account-box strong,.account-box span{display:block}.account-box span{font-size:12px;color:var(--muted);margin-top:3px}.welcome{background:linear-gradient(135deg,#10251a,#1f5138);color:#fff;padding:32px;border-radius:26px;box-shadow:var(--shadow-lg);margin-bottom:22px}.welcome h1{font-size:36px;letter-spacing:-.05em;margin:5px 0 8px}.welcome p{color:#c2d6c9;max-width:720px;line-height:1.65;margin:0}.role-pill{display:inline-flex;margin-top:18px;padding:7px 11px;border:1px solid rgba(255,255,255,.18);border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.08em}.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.module-card{display:block;background:white;border:1px solid var(--line);border-radius:20px;padding:22px;text-decoration:none;color:inherit;box-shadow:var(--shadow-sm);transition:.18s ease}.module-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:#bfd2c5}.module-icon{width:42px;height:42px;border-radius:13px;background:#eaf2ed;display:grid;place-items:center;font-size:20px;margin-bottom:18px}.module-card h2{font-size:18px;margin:0 0 7px}.module-card p{font-size:13px;color:var(--muted);line-height:1.55;margin:0}.module-card .go{display:inline-block;margin-top:18px;font-size:12px;font-weight:800;color:#24553b}.section-title{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.09em;margin:26px 0 12px}.workspace-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.hidden{display:none!important}@media(max-width:900px){.module-grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.workspace{padding:16px}.workspace-head{align-items:flex-start}.account-box{text-align:left}.workspace-head{flex-direction:column}.module-grid{grid-template-columns:1fr}.welcome{padding:24px}.welcome h1{font-size:29px}}
  </style>
</head>
<body>
<main class="workspace">
  <header class="workspace-head">
    <div class="workspace-brand"><div class="brand-mark">YF</div><div><strong>YardFlow</strong><div class="sub">Unified Operations Workspace</div></div></div>
    <div class="account-box"><strong id="account-name">Loading…</strong><span id="account-email"></span></div>
  </header>

  <section class="welcome">
    <div class="eyebrow" style="color:#9ebaaa">WORKSPACE</div>
    <h1 id="welcome-title">Welcome to YardFlow</h1>
    <p id="welcome-copy">Everything you are allowed to use is available from this workspace. No hidden routes, no confusing dead ends.</p>
    <span class="role-pill" id="role-pill">CHECKING ACCESS</span>
  </section>

  <div class="section-title">AVAILABLE TO YOU</div>
  <section id="module-grid" class="module-grid"></section>

  <div class="workspace-actions"><button id="workspace-logout" class="ghost-btn">Logout</button></div>
</main>
<div id="toast" class="toast"></div>
<script src="/js/runtime-client.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
