spring:
  application:
    name: operation
  datasource:
    url: jdbc:h2:mem:operationdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/problem+json,text/html,text/css,application/javascript,text/javascript

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  auth:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-key-1234567890}
    jwt-expiration-seconds: 28800
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@operation.local}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
  tracking:
    redis-enabled: ${TRACKING_REDIS_ENABLED:false}
    stale-minutes: 25
    near-destination-meters: 500
  storage:
    root: ${STORAGE_ROOT:uploads}
